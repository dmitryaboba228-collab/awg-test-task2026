name: Server probe

# Одноразовая диагностика: проверяет, достижим ли деплой-сервер из сети
# GitHub Actions. Запускается пушем в свою ветку, в основной CI не входит.

on:
  push:
    branches: [chore/server-probe]

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Runner egress IP
        run: curl -s https://ifconfig.me; echo

      - name: ICMP
        run: ping -c 3 -W 3 "$HOST" || echo 'ICMP: FAIL'

      - name: TCP ports
        run: |
          for p in 22 80 443; do
            if nc -zv -w 8 "$HOST" "$p" 2>&1; then
              echo "port $p: OPEN"
            else
              echo "port $p: BLOCKED"
            fi
          done

      - name: SSH banner
        run: |
          ssh -v -o ConnectTimeout=15 -o BatchMode=yes \
              -o StrictHostKeyChecking=no "root@$HOST" exit 2>&1 | tail -6 || true
