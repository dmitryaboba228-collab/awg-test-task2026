name: Deploy bootstrap

# Одноразовый джоб: кладёт публичный ключ раннера в authorized_keys и
# проверяет, что дальше вход работает уже по ключу. Вход по паролю нужен
# только здесь. В основной CI не входит.

on:
  push:
    branches: [chore/server-probe]

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Prepare key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          ssh-keygen -lf ~/.ssh/id_ed25519.pub

      - name: Reachability
        run: |
          nc -zv -w 8 "$HOST" 22

      - name: Install public key
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          PUB="$(cat ~/.ssh/id_ed25519.pub)"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 "root@$HOST" \
            "mkdir -p ~/.ssh && chmod 700 ~/.ssh && touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys && (grep -qxF '$PUB' ~/.ssh/authorized_keys || echo '$PUB' >> ~/.ssh/authorized_keys) && grep -c gitpulse-ci-deploy ~/.ssh/authorized_keys"

      - name: Verify key auth
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 "root@$HOST" \
            "echo KEY_AUTH_OK && cat /etc/os-release | head -1 && (docker --version || echo NO_DOCKER) && (docker compose version || echo NO_COMPOSE) && df -h / | tail -1"
