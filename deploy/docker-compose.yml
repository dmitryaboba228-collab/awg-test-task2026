# Production stack: the gitpulse host behind Caddy, which terminates TLS
# with an automatically issued and renewed Let's Encrypt certificate.
#
#   export GITPULSE_DOMAIN=<public hostname, e.g. 1-2-3-4.sslip.io>
#   make package                 # from the repo root — builds dist/*.whl
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# gitpulse itself is not published on the host — only Caddy is, on 80/443.
# Both clones and certificates persist in named volumes across restarts.
services:
  gitpulse:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    volumes:
      - gitpulse-workspace:/data/workspace
    expose:
      - '8000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      GITPULSE_DOMAIN: ${GITPULSE_DOMAIN:?set GITPULSE_DOMAIN before starting}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gitpulse

volumes:
  gitpulse-workspace:
  caddy-data:
  caddy-config:
